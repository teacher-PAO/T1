<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 2 Multiplication Fun!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f3f9ff;
      --card: #ffffff;
      --primary: #ff6584;
      --secondary: #43b0f1;
      --accent: #ffc107;
      --green: #4caf50;
      --text: #2c3e50;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bubblegum Sans', sans-serif;
    }

    body {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 4px solid #d4ebf8;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .badge {
      background: #eef7ff;
      padding: 6px 14px;
      border-radius: 999px;
      border: 2px solid #bde0fe;
    }

    .star-score {
      color: #e67e22;
    }

    .progress-bar {
      height: 12px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #43b0f1, #3cd070);
      width: 10%;
      transition: width 0.3s;
    }

    .question-box {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .equation {
      font-size: 3rem;
      font-weight: 900;
      color: #2b5c8f;
      letter-spacing: 2px;
      margin: 0.2rem 0;
    }

    .clue-label {
      font-size: 0.95rem;
      color: #7f8c8d;
      margin-bottom: 0.5rem;
    }

    /* Visual Groups */
    .groups-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 1rem 0;
      min-height: 90px;
    }

    .item-group {
      background: #fdfaf0;
      border: 2px dashed #fcd34d;
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      max-width: 100px;
      gap: 4px;
      font-size: 1.3rem;
    }

    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 1rem;
    }

    .opt-btn {
      background: #ffffff;
      border: 3px solid #bde0fe;
      border-radius: 16px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #2b5c8f;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #bde0fe;
      transition: all 0.15s ease;
    }

    .opt-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #bde0fe;
    }

    .opt-btn.correct {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
      box-shadow: 0 4px 0 #4caf50;
    }

    .opt-btn.wrong {
      background: #ffebee;
      border-color: #e53935;
      color: #c62828;
      box-shadow: 0 4px 0 #e53935;
    }

    /* Feedback Banner */
    .feedback-banner {
      margin-top: 1rem;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }

    .next-btn {
      width: 100%;
      margin-top: 1rem;
      background: #ff6584;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 0 #d94b68;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d94b68;
    }

    /* Result Screen & Review */
    .screen {
      display: none;
    }

    .active-screen {
      display: block;
    }

    .result-card {
      text-align: center;
    }

    .result-score {
      font-size: 2.5rem;
      color: #2b5c8f;
      margin: 10px 0;
    }

    .review-list {
      max-height: 280px;
      overflow-y: auto;
      text-align: left;
      margin: 1.5rem 0;
      padding-right: 6px;
    }

    .review-item {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-left: 5px solid #ccc;
    }

    .review-item.good {
      border-left-color: #4caf50;
    }

    .review-item.bad {
      border-left-color: #ef4444;
    }

    .restart-btn {
      background: #43b0f1;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #288dc7;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen active-screen">
      <div class="top-bar">
        <span class="badge" id="q-tracker">Question 1/10</span>
        <span class="badge star-score" id="score-tracker">⭐ 0</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="question-box">
        <div class="clue-label">Multiply the numbers!</div>
        <div class="equation" id="equation-text">2 × 3 = ?</div>
      </div>

      <div class="clue-label" style="text-align:center;">
        <span id="group-help">2 groups of 3</span>:
      </div>
      <div class="groups-container" id="groups-container"></div>

      <div class="options-grid" id="options-grid"></div>

      <div class="feedback-banner" id="feedback-banner"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➜</button>
    </div>

    <!-- RESULT & ANSWER KEY SCREEN -->
    <div id="result-screen" class="screen">
      <div class="result-card">
        <h2>🎉 Great Job! 🎉</h2>
        <div class="result-score" id="final-score">Score: 10/10</div>
        <p id="motivational-text">You are a multiplication star!</p>

        <h3 style="text-align: left; margin-top: 1.5rem; color: #2b5c8f;">Answer Key & Steps:</h3>
        <div class="review-list" id="review-list"></div>

        <button class="restart-btn" onclick="startQuiz()">Play Again 🔄</button>
      </div>
    </div>

  </div>

  <script>
    const ICONS = ['🍎', '⭐', '🎈', '🍪', '🐸', '🧁', '🚗', '🍓'];
    const TOTAL_QUESTIONS = 10;
    
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    // Simple Web Audio Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(frequency, duration, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio might fail before user interaction
      }
    }

    function soundCorrect() {
      playBeep(523.25, 0.12);
      setTimeout(() => playBeep(659.25, 0.25), 100);
    }

    function soundWrong() {
      playBeep(260, 0.15, 'sawtooth');
      setTimeout(() => playBeep(220, 0.25, 'sawtooth'), 120);
    }

    // Grade 2 appropriate numbers (tables: 2, 3, 4, 5, 10 up to standard elementary sizes)
    function generateQuestions() {
      const list = [];
      const primaryFactors = [2, 3, 4, 5, 10];

      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const a = primaryFactors[Math.floor(Math.random() * primaryFactors.length)];
        const b = Math.floor(Math.random() * 8) + 2; // 2 to 9
        const answer = a * b;
        const icon = ICONS[Math.floor(Math.random() * ICONS.length)];

        // Distractors
        const options = new Set([answer]);
        while (options.size < 4) {
          const delta = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? -1 : 1);
          const fake = answer + delta;
          if (fake > 0 && fake !== answer) {
            options.add(fake);
          }
        }

        list.push({
          num1: a,
          num2: b,
          answer: answer,
          icon: icon,
          options: Array.from(options).sort(() => Math.random() - 0.5)
        });
      }
      return list;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      
      document.getElementById('q-tracker').textContent = `Question ${currentIndex + 1}/${TOTAL_QUESTIONS}`;
      document.getElementById('score-tracker').textContent = `⭐ ${score}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex) / TOTAL_QUESTIONS) * 100}%`;
      document.getElementById('equation-text').textContent = `${q.num1} × ${q.num2} = ?`;
      document.getElementById('group-help').textContent = `${q.num1} groups of ${q.num2}`;

      // Render Visual Items
      const groupContainer = document.getElementById('groups-container');
      groupContainer.innerHTML = '';
      for (let g = 0; g < q.num1; g++) {
        const groupEl = document.createElement('div');
        groupEl.className = 'item-group';
        let itemsStr = '';
        for (let it = 0; it < q.num2; it++) {
          itemsStr += q.icon;
        }
        groupEl.textContent = itemsStr;
        groupContainer.appendChild(groupEl);
      }

      // Render Options
      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';
      q.options.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = val;
        btn.onclick = () => checkAnswer(val, btn);
        optionsGrid.appendChild(btn);
      });

      // Reset controls
      const feedback = document.getElementById('feedback-banner');
      feedback.style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selected, button) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const q = questions[currentIndex];
      const allButtons = document.querySelectorAll('.opt-btn');
      allButtons.forEach(b => (b.disabled = true));

      const isCorrect = selected === q.answer;
      userAnswers.push({
        ...q,
        selected: selected,
        isCorrect: isCorrect
      });

      const feedback = document.getElementById('feedback-banner');
      feedback.style.display = 'block';

      if (isCorrect) {
        score++;
        button.classList.add('correct');
        feedback.style.background = '#e8f5e9';
        feedback.style.color = '#2e7d32';
        feedback.textContent = `🌟 Correct! ${q.num1} × ${q.num2} = ${q.answer}`;
        soundCorrect();
      } else {
        button.classList.add('wrong');
        allButtons.forEach(b => {
          if (parseInt(b.textContent) === q.answer) b.classList.add('correct');
        });
        feedback.style.background = '#ffebee';
        feedback.style.color = '#c62828';
        feedback.textContent = `Keep going! ${q.num1} × ${q.num2} is ${q.answer}`;
        soundWrong();
      }

      document.getElementById('score-tracker').textContent = `⭐ ${score}`;
      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < TOTAL_QUESTIONS) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.remove('active-screen');
      document.getElementById('result-screen').classList.add('active-screen');

      document.getElementById('final-score').textContent = `Score: ${score} / ${TOTAL_QUESTIONS}`;

      const msg = document.getElementById('motivational-text');
      if (score === 10) {
        msg.textContent = '🌟 Perfect Score! You are a Math Champion!';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else if (score >= 7) {
        msg.textContent = '👏 Great effort! Keep practicing!';
      } else {
        msg.textContent = '💪 Good try! Practice makes perfect!';
      }

      // Generate Answer Key with repeated addition explanation
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';

      userAnswers.forEach((ans, idx) => {
        const item = document.createElement('div');
        item.className = `review-item ${ans.isCorrect ? 'good' : 'bad'}`;

        const repeatedAddition = Array(ans.num1).fill(ans.num2).join(' + ');

        item.innerHTML = `
          <strong>Q${idx + 1}: ${ans.num1} × ${ans.num2} = ${ans.answer}</strong><br>
          <span>Your Answer: ${ans.selected} ${ans.isCorrect ? '✅' : '❌'}</span><br>
          <small style="color:#555;">How to think: ${repeatedAddition} = ${ans.answer}</small>
        `;
        reviewList.appendChild(item);
      });
    }

    function startQuiz() {
      questions = generateQuestions();
      currentIndex = 0;
      score = 0;
      userAnswers = [];
      document.getElementById('result-screen').classList.remove('active-screen');
      document.getElementById('quiz-screen').classList.add('active-screen');
      renderQuestion();
    }

    // Initialize on load
    startQuiz();
  </script>
</body>
</html>
