<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table Generator</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #45a049;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 10px;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        .result-box {
            background-color: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.8;
            max-height: 350px;
            overflow-y: auto;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ตารางสูตรคูณ</h2>
        
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="ระบุแม่สูตรคูณ..." value="2" onkeypress="handleKeyPress(event)">
            <button onclick="generateTable()">สร้าง</button>
        </div>

        <div id="resultBox" class="result-box">
            <!-- ผลลัพธ์จะแสดงที่นี่ -->
        </div>
    </div>

    <script>
        // ฟังก์ชันหลักสำหรับสร้างสูตรคูณ
        function generateTable() {
            const numInput = document.getElementById('numberInput').value;
            const resultBox = document.getElementById('resultBox');
            
            // Validate input
            if (numInput === '' || isNaN(numInput)) {
                resultBox.innerHTML = '<div class="error">กรุณาระบุตัวเลขที่ถูกต้อง</div>';
                return;
            }

            const num = parseInt(numInput, 10);
            let htmlContent = `<strong>สูตรคูณแม่ ${num}</strong><br><hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">`;

            // วนลูปสร้างสูตรคูณ 1 ถึง 12
            for (let i = 1; i <= 12; i++) {
                const product = num * i;
                htmlContent += `${num} &times; ${i} = <strong>${product}</strong><br>`;
            }

            // นำผลลัพธ์ไปแสดงใน DOM
            resultBox.innerHTML = htmlContent;
        }

        // ฟังก์ชันรองรับการกด Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                generateTable();
            }
        }

        // โหลดข้อมูลเริ่มต้นเมื่อเปิดหน้าเว็บ
        window.onload = () => {
            generateTable();
            document.getElementById('numberInput').focus();
        };
    </script>

</body>
</html>
