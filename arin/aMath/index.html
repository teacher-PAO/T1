<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Amath Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --board-bg: #0b5345;
            --cell-bg: #e5e8e8;
            --tw: #e74c3c;
            --dw: #f39c12;
            --tl: #2980b9;
            --dl: #8e44ad;
            --star: #f1c40f;
            --tile-bg: #fdf2e9;
            --tile-locked: #fae5d3;
            --tile-text: #212f3d;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #17202a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            background: #273746;
            padding: 10px 20px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #f1c40f;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .board-wrapper {
            background: var(--board-bg);
            padding: 5px;
            border-radius: 8px;
            border: 4px solid #145a32;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 2px;
            background: #117864;
            width: 95vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: var(--cell-bg);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.6rem;
            font-weight: bold;
            color: rgba(0,0,0,0.5);
            cursor: pointer;
            border-radius: 2px;
        }

        .cell.tw { background: var(--tw); color: white; }
        .cell.dw { background: var(--dw); color: white; }
        .cell.tl { background: var(--tl); color: white; }
        .cell.dl { background: var(--dl); color: white; }
        .cell.star { background: var(--star); color: #333; font-size: 1.2rem; }

        .tile {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--tile-bg);
            color: var(--tile-text);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 3px;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.3);
            border: 1px solid #d5cba8;
            z-index: 10;
            transition: transform 0.1s;
        }

        .tile.locked {
            background: var(--tile-locked);
            cursor: default;
        }

        .tile.selected {
            border: 2px solid #e74c3c;
            transform: scale(1.1);
            z-index: 20;
        }

        .tile::after {
            content: attr(data-score);
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 0.5rem;
            color: #7f8c8d;
            font-weight: normal;
        }

        .rack-container {
            background: #873600;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            gap: 5px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            box-sizing: border-box;
            height: 65px;
        }

        .rack-slot {
            width: 45px;
            height: 45px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            position: relative;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-family: inherit;
        }

        .btn-recall { background: #f39c12; }
        .btn-shuffle { background: #3498db; }
        .btn-play { background: #2ecc71; }
        .btn:active { transform: translateY(2px); }

        #message {
            margin-top: 10px;
            height: 24px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
        }

        @media (max-width: 480px) {
            .tile { font-size: 1rem; }
            .tile::after { font-size: 0.4rem; }
            .rack-slot { width: 40px; height: 40px; }
            .controls { flex-wrap: wrap; }
            .btn { flex-basis: 40%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Amath Master for Alin</h1>
        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Tiles: <span id="tiles-left">0</span></div>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>

    <div class="rack-container" id="rack">
        <!-- Rack slots generated by JS -->
    </div>

    <div class="controls">
        <button class="btn btn-recall" onclick="recallTiles()">ดึงกลับ (Recall)</button>
        <button class="btn btn-shuffle" onclick="shuffleRack()">สลับเบี้ย (Shuffle)</button>
        <button class="btn btn-play" onclick="playTurn()">ลงเบี้ย (Play)</button>
    </div>

    <div id="message"></div>

    <script>
        // Game Constants & Configuration
        const TILE_DISTRIBUTION = {
            '0': { count: 5, score: 1 }, '1': { count: 6, score: 1 },
            '2': { count: 6, score: 1 }, '3': { count: 5, score: 1 },
            '4': { count: 5, score: 2 }, '5': { count: 4, score: 2 },
            '6': { count: 4, score: 2 }, '7': { count: 4, score: 2 },
            '8': { count: 4, score: 2 }, '9': { count: 4, score: 2 },
            '+': { count: 4, score: 2 }, '-': { count: 4, score: 2 },
            '×': { count: 4, score: 2 }, '÷': { count: 4, score: 2 },
            '=': { count: 11, score: 1 }
        };

        const TW = ['0,0','0,7','0,14','7,0','7,14','14,0','14,7','14,14'];
        const DW = ['1,1','2,2','3,3','4,4','1,13','2,12','3,11','4,10','13,1','12,2','11,3','10,4','13,13','12,12','11,11','10,10'];
        const TL = ['1,5','1,9','5,1','5,5','5,9','5,13','9,1','9,5','9,9','9,13','13,5','13,9'];
        const DL = ['0,3','0,11','2,6','2,8','3,0','3,7','3,14','6,2','6,6','6,8','6,12','7,3','7,11','8,2','8,6','8,8','8,12','11,0','11,7','11,14','12,6','12,8','14,3','14,11'];

        // Game State
        let bag = [];
        let rack = []; // holds { id, char, score }
        let boardState = Array(15).fill(null).map(() => Array(15).fill(null)); // holds { char, score, locked, id }
        
        let score = 0;
        let isFirstTurn = true;
        let selectedTileId = null;
        let tileIdCounter = 0;

        // Initialize Game
        function initGame() {
            // Build bag
            for (const [char, data] of Object.entries(TILE_DISTRIBUTION)) {
                for (let i = 0; i < data.count; i++) {
                    bag.push({ char: char, score: data.score });
                }
            }
            shuffleArray(bag);
            
            initBoardUI();
            initRackUI();
            drawTiles();
            updateStatsUI();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // UI Initialization
        function initBoardUI() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    const coord = `${r},${c}`;
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    
                    if (r === 7 && c === 7) { cell.classList.add('star'); cell.innerText = '★'; }
                    else if (TW.includes(coord)) { cell.classList.add('tw'); cell.innerText = '3W'; }
                    else if (DW.includes(coord)) { cell.classList.add('dw'); cell.innerText = '2W'; }
                    else if (TL.includes(coord)) { cell.classList.add('tl'); cell.innerText = '3L'; }
                    else if (DL.includes(coord)) { cell.classList.add('dl'); cell.innerText = '2L'; }

                    cell.onclick = () => handleBoardClick(r, c);
                    board.appendChild(cell);
                }
            }
        }

        function initRackUI() {
            const rackEl = document.getElementById('rack');
            rackEl.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = 'rack-slot';
                slot.id = `rack-slot-${i}`;
                slot.onclick = () => handleRackClick(i);
                rackEl.appendChild(slot);
            }
        }

        function drawTiles() {
            while (rack.length < 8 && bag.length > 0) {
                let t = bag.pop();
                t.id = `tile-${tileIdCounter++}`;
                rack.push(t);
            }
            renderRack();
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('tiles-left').innerText = bag.length;
        }

        function renderRack() {
            for (let i = 0; i < 8; i++) {
                const slot = document.getElementById(`rack-slot-${i}`);
                slot.innerHTML = '';
                if (rack[i]) {
                    slot.appendChild(createTileElement(rack[i], false));
                }
            }
        }

        function renderBoard() {
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    // Remove existing tiles
                    const existingTile = cell.querySelector('.tile');
                    if (existingTile) cell.removeChild(existingTile);
                    
                    if (boardState[r][c]) {
                        cell.appendChild(createTileElement(boardState[r][c], true));
                    }
                }
            }
        }

        function createTileElement(tileData, onBoard) {
            const t = document.createElement('div');
            t.className = 'tile';
            if (onBoard && tileData.locked) t.classList.add('locked');
            if (tileData.id === selectedTileId) t.classList.add('selected');
            
            t.innerText = tileData.char;
            t.setAttribute('data-score', tileData.score);
            return t;
        }

        function showMessage(msg, isError = true) {
            const m = document.getElementById('message');
            m.innerText = msg;
            m.style.color = isError ? '#e74c3c' : '#2ecc71';
            setTimeout(() => { m.innerText = ''; }, 3000);
        }

        // Interaction Handlers
        function handleRackClick(index) {
            if (!rack[index]) return;
            if (selectedTileId === rack[index].id) {
                selectedTileId = null; // deselect
            } else {
                selectedTileId = rack[index].id;
            }
            renderRack();
            renderBoard();
        }

        function handleBoardClick(r, c) {
            // If cell has an unlocked tile, pick it up back to rack
            if (boardState[r][c] && !boardState[r][c].locked) {
                if(selectedTileId) return; // Don't pick up if holding something
                const tile = boardState[r][c];
                boardState[r][c] = null;
                rack.push(tile);
                selectedTileId = tile.id;
                renderBoard();
                renderRack();
                return;
            }

            // If holding a tile and cell is empty, place it
            if (selectedTileId && !boardState[r][c]) {
                const rackIndex = rack.findIndex(t => t.id === selectedTileId);
                if (rackIndex > -1) {
                    const tile = rack.splice(rackIndex, 1)[0];
                    boardState[r][c] = { ...tile, locked: false };
                    selectedTileId = null;
                    renderRack();
                    renderBoard();
                } else {
                    // Check if moving from another board spot
                    let found = false;
                    for(let i=0; i<15; i++) {
                        for(let j=0; j<15; j++) {
                            if(boardState[i][j] && boardState[i][j].id === selectedTileId && !boardState[i][j].locked) {
                                boardState[r][c] = boardState[i][j];
                                boardState[i][j] = null;
                                selectedTileId = null;
                                renderBoard();
                                found = true;
                                break;
                            }
                        }
                        if(found) break;
                    }
                }
            }
        }

        function recallTiles() {
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (boardState[r][c] && !boardState[r][c].locked) {
                        rack.push(boardState[r][c]);
                        boardState[r][c] = null;
                    }
                }
            }
            selectedTileId = null;
            renderBoard();
            renderRack();
        }

        function shuffleRack() {
            recallTiles();
            shuffleArray(rack);
            renderRack();
        }

        // Logic & Validation (Simplified Amath Rules)
        function playTurn() {
            let placedCells = [];
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (boardState[r][c] && !boardState[r][c].locked) {
                        placedCells.push({r, c, tile: boardState[r][c]});
                    }
                }
            }

            if (placedCells.length === 0) return showMessage("คุณยังไม่ได้ลงเบี้ยเลย!");

            // 1. Check Alignment
            let isRow = placedCells.every(p => p.r === placedCells[0].r);
            let isCol = placedCells.every(p => p.c === placedCells[0].c);
            if (!isRow && !isCol && placedCells.length > 1) {
                return showMessage("เบี้ยต้องวางเรียงในแถวหรือคอลัมน์เดียวกัน!");
            }

            // Determine primary direction
            let orientation = isRow ? 'horizontal' : 'vertical';
            if (placedCells.length === 1) {
                // Determine orientation based on neighbors if only 1 tile played
                let pr = placedCells[0].r, pc = placedCells[0].c;
                if ((pr>0 && boardState[pr-1][pc]) || (pr<14 && boardState[pr+1][pc])) orientation = 'vertical';
                else orientation = 'horizontal';
            }

            // 2. Check Continuity and Center Star (First Turn)
            if (isFirstTurn) {
                let onCenter = placedCells.some(p => p.r === 7 && p.c === 7);
                if (!onCenter) return showMessage("ตาแรกต้องวางทับดาวตรงกลาง (7,7)!");
                if (!checkContiguous(placedCells, orientation)) return showMessage("เบี้ยต้องวางต่อกัน!");
            } else {
                // Must connect to at least one locked tile, and be contiguous
                if (!checkContiguous(placedCells, orientation)) return showMessage("เบี้ยต้องวางต่อกันเป็นสมการเดียว!");
                if (!isConnectedToLocked(placedCells)) return showMessage("ต้องวางต่อกับสมการเดิมที่มีอยู่แล้ว!");
            }

            // 3. Extract Equations and Validate
            let equations = extractAllEquations(placedCells, orientation);
            if (equations.length === 0) return showMessage("ไม่พบสมการ!");

            let turnScore = 0;
            for (let eq of equations) {
                if (eq.str.length < 5) return showMessage(`สมการสั้นเกินไป: ${eq.str}`);
                if (!eq.str.includes('=')) return showMessage(`สมการต้องมีเครื่องหมาย = (${eq.str})`);
                
                if (!validateMath(eq.str)) {
                    return showMessage(`สมการผิดพลาด: ${eq.str}`);
                }
                turnScore += calculateEquationScore(eq.cells);
            }

            // Bingo Bonus (Used all 8 tiles)
            if (placedCells.length === 8) {
                turnScore += 40; 
                showMessage(`BINGO! ได้โบนัส 40 คะแนน รวม ${turnScore} แต้ม!`, false);
            } else {
                showMessage(`ผ่าน! ได้ ${turnScore} คะแนน`, false);
            }

            // Commit
            score += turnScore;
            placedCells.forEach(p => { boardState[p.r][p.c].locked = true; });
            isFirstTurn = false;
            selectedTileId = null;
            drawTiles();
            renderBoard();
        }

        function checkContiguous(placed, orientation) {
            placed.sort((a,b) => orientation==='horizontal' ? a.c - b.c : a.r - b.r);
            let first = placed[0];
            let last = placed[placed.length-1];
            
            if (orientation === 'horizontal') {
                for (let c = first.c; c <= last.c; c++) {
                    if (!boardState[first.r][c]) return false;
                }
            } else {
                for (let r = first.r; r <= last.r; r++) {
                    if (!boardState[r][first.c]) return false;
                }
            }
            return true;
        }

        function isConnectedToLocked(placed) {
            for (let p of placed) {
                let neighbors = [
                    {r: p.r-1, c: p.c}, {r: p.r+1, c: p.c},
                    {r: p.r, c: p.c-1}, {r: p.r, c: p.c+1}
                ];
                for (let n of neighbors) {
                    if (n.r>=0 && n.r<=14 && n.c>=0 && n.c<=14) {
                        if (boardState[n.r][n.c] && boardState[n.r][n.c].locked) return true;
                    }
                }
            }
            return false;
        }

        function extractAllEquations(placed, primaryOrientation) {
            let eqs = [];
            
            // Extract primary equation
            let first = placed[0];
            let primaryEq = getFullLine(first.r, first.c, primaryOrientation);
            if (primaryEq.cells.length > 1) eqs.push(primaryEq);

            // Extract secondary (cross) equations
            let crossOrientation = primaryOrientation === 'horizontal' ? 'vertical' : 'horizontal';
            for (let p of placed) {
                let crossEq = getFullLine(p.r, p.c, crossOrientation);
                if (crossEq.cells.length > 1) eqs.push(crossEq);
            }

            return eqs;
        }

        function getFullLine(r, c, orientation) {
            let cells = [];
            let startR = r, startC = c;
            
            if (orientation === 'horizontal') {
                while (startC > 0 && boardState[startR][startC-1]) startC--;
                let currC = startC;
                while (currC <= 14 && boardState[startR][currC]) {
                    cells.push({r: startR, c: currC, tile: boardState[startR][currC]});
                    currC++;
                }
            } else {
                while (startR > 0 && boardState[startR-1][startC]) startR--;
                let currR = startR;
                while (currR <= 14 && boardState[currR][startC]) {
                    cells.push({r: currR, c: startC, tile: boardState[currR][startC]});
                    currR++;
                }
            }
            
            let str = cells.map(x => x.tile.char).join('');
            return { str, cells };
        }

        function validateMath(eqStr) {
            let parts = eqStr.split('=');
            if(parts.length !== 2) return false;
            if(parts[0] === "" || parts[1] === "") return false;

            try {
                // Prevent leading zeros issues in eval
                let lStr = parts[0].replace(/×/g, '*').replace(/÷/g, '/').replace(/ 0+(\d)/g, '$1');
                let rStr = parts[1].replace(/×/g, '*').replace(/÷/g, '/').replace(/ 0+(\d)/g, '$1');
                
                // Disallow operators at start/end or consecutive operators
                if (/^[\+\-\*\/]/.test(lStr) || /[\+\-\*\/]$/.test(lStr)) return false;
                if (/^[\+\-\*\/]/.test(rStr) || /[\+\-\*\/]$/.test(rStr)) return false;
                if (/[\+\-\*\/]{2,}/.test(lStr) || /[\+\-\*\/]{2,}/.test(rStr)) return false;

                let leftVal = eval(lStr);
                let rightVal = eval(rStr);

                return (leftVal === rightVal && !isNaN(leftVal) && leftVal !== Infinity);
            } catch (e) {
                return false;
            }
        }

        function calculateEquationScore(cells) {
            let eqScore = 0;
            let wordMultipliers = 1;

            for (let cellData of cells) {
                let r = cellData.r;
                let c = cellData.c;
                let tile = cellData.tile;
                let coord = `${r},${c}`;
                
                let tileScore = parseInt(tile.score);

                // Apply multipliers ONLY for newly placed tiles (!locked)
                if (!tile.locked) {
                    if (TL.includes(coord)) tileScore *= 3;
                    else if (DL.includes(coord)) tileScore *= 2;
                    
                    if (TW.includes(coord)) wordMultipliers *= 3;
                    else if (DW.includes(coord) || (r===7 && c===7)) wordMultipliers *= 2;
                }
                
                eqScore += tileScore;
            }
            
            return eqScore * wordMultipliers;
        }

        // Start the game on load
        window.onload = initGame;

    </script>
</body>
</html>
