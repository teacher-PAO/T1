<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amath Freestyle Challenge 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', 'Mali', sans-serif;
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .game-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 4px solid #90caf9;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .title {
            font-size: 1.8rem;
            color: #ff3d00;
            margin: 0;
            text-shadow: 2px 2px 0px #ffeb3b;
        }

        .stats-panel { display: flex; gap: 10px; }
        .stat-box {
            background: #fff; border-radius: 10px; padding: 5px 12px;
            border: 3px solid #e0e0e0; text-align: center; min-width: 70px;
        }
        .stat-label { color: #2196f3; font-size: 0.8rem; font-weight: 900; }
        .stat-value { font-size: 1.4rem; color: #ff3d00; font-weight: 900; }

        /* 15x15 Grid Board */
        .board-container {
            width: 100%; max-width: 450px; aspect-ratio: 1 / 1;
            background-color: #fff; border-radius: 8px; border: 5px solid #2e7d32;
            padding: 3px; box-shadow: 0 6px 0 #1b5e20; margin-bottom: 15px;
            position: relative;
        }

        .grid-board {
            display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
            gap: 1px; width: 100%; height: 100%; background: #bdbdbd;
        }

        .cell {
            background: #8bc34a; position: relative; display: flex;
            justify-content: center; align-items: center;
        }

        /* Special Cells */
        .cell.tw { background: #f44336; } 
        .cell.dw { background: #ff9800; } 
        .cell.tl { background: #03a9f4; } 
        .cell.dl { background: #9c27b0; } 
        .cell.star { background: #ffeb3b; }

        .cell-label {
            font-size: 0.5rem; font-weight: 900; color: rgba(255,255,255,0.9); pointer-events: none;
        }
        .cell.star .cell-label { color: #f57f17; font-size: 0.8rem; }

        /* Tiles */
        .tile {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #fff9c4; border-radius: 2px; display: flex;
            justify-content: center; align-items: center;
            font-size: 1rem; font-weight: 900; color: #d84315;
            box-shadow: 1px 1px 0 #fbc02d; border: 1px solid #fbc02d; z-index: 2;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tile::after {
            content: attr(data-score); position: absolute; bottom: 1px; right: 2px;
            font-size: 0.4rem; color: #8d6e63;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Input Zone */
        .input-zone-container {
            width: 100%; max-width: 500px; background: #e3f2fd;
            border: 3px dashed #64b5f6; border-radius: 12px;
            min-height: 60px; display: flex; align-items: center;
            justify-content: center; gap: 5px; padding: 10px;
            margin-bottom: 15px; box-sizing: border-box; flex-wrap: wrap;
        }

        .input-tile {
            width: 40px; height: 45px; background: #fff9c4;
            border-radius: 6px; display: flex; justify-content: center;
            align-items: center; font-size: 1.5rem; font-weight: 900;
            color: #0277bd; box-shadow: 0 4px 0 #fbc02d; border: 2px solid #f9a825;
            position: relative;
        }
        .input-tile::after {
            content: attr(data-score); position: absolute; bottom: 2px; right: 4px;
            font-size: 0.6rem; color: #8d6e63;
        }

        /* Rack */
        .rack {
            background: #ffb300; padding: 10px; border-radius: 15px;
            border: 4px solid #ff8f00; box-shadow: 0 6px 0 #e65100;
            display: flex; flex-direction: column; gap: 8px; width: 100%;
            max-width: 500px; margin-bottom: 15px; box-sizing: border-box;
        }
        .rack-row { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }

        .rack-tile {
            width: 38px; height: 42px; background: #fff; border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; font-weight: 900; color: #333;
            box-shadow: 0 4px 0 #bdbdbd; border: 2px solid #e0e0e0; cursor: pointer;
            position: relative; transition: transform 0.1s;
        }
        .rack-tile:active { transform: translateY(4px); box-shadow: 0 0 0 #bdbdbd; }
        .rack-tile.op { background: #4fc3f7; color: #01579b; box-shadow: 0 4px 0 #0288d1; border-color: #03a9f4; }
        .rack-tile.op:active { box-shadow: 0 0 0 #0288d1; }
        
        .rack-tile::after {
            content: attr(data-score); position: absolute; bottom: 2px; right: 4px;
            font-size: 0.6rem; color: #888;
        }

        /* Buttons */
        .action-buttons { display: flex; gap: 10px; width: 100%; max-width: 500px; }
        .btn {
            flex: 1; padding: 12px 10px; font-size: 1.1rem; font-weight: 900;
            border: none; border-radius: 10px; cursor: pointer; color: white;
            box-shadow: 0 5px 0px rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 0px 0px rgba(0,0,0,0.2); }
        .btn-red { background: #ef5350; box-shadow: 0 5px 0 #c62828; }
        .btn-green { background: #4caf50; box-shadow: 0 5px 0 #2e7d32; }

        .error-msg {
            color: #d32f2f; font-family: 'Mali'; font-weight: bold;
            height: 20px; margin-bottom: 10px; text-align: center;
        }

        /* Screens */
        .overlay-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30;
        }
        .overlay-screen h2 { font-size: 3rem; color: #1565c0; margin-bottom: 10px; text-align:center;}
        .btn-start {
            background: #ffca28; color: #d84315; font-size: 1.8rem;
            padding: 15px 40px; border-radius: 50px; box-shadow: 0 8px 0 #ff8f00; border: 4px solid #fff;
        }
        .btn-start:active { transform: translateY(8px); box-shadow: 0 0 0 #ff8f00; }
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .input-tile { width: 30px; height: 35px; font-size: 1.2rem; }
            .rack-tile { width: 32px; height: 38px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-panel">
            <h1 class="title">AMATH FREESTYLE</h1>
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Time</div>
                    <div class="stat-value" id="time">90</div>
                </div>
            </div>
        </div>

        <div id="start-screen" class="overlay-screen">
            <h2>คิดเอง สร้างเอง!<br>💡</h2>
            <p style="text-align:center; font-family:'Mali'; font-size:1.1rem; padding: 0 20px;">
                ไม่มีโจทย์กำหนดให้ คุณต้องสร้างสมการที่ถูกต้องด้วยตัวเอง (เช่น 5+5=10)<br>
                สมการที่ถูกจะถูกวางลงบนกระดานเพื่อคิดคะแนนคูณพิเศษ!
            </p>
            <button class="btn btn-start" onclick="startGame()">เริ่มเกม</button>
        </div>

        <div id="end-screen" class="overlay-screen hidden">
            <h2>หมดเวลา! ⏰</h2>
            <p style="font-size:1.5rem;">คะแนนรวมของคุณ: <br><span id="final-score" style="font-size: 4rem; color: #4caf50; font-weight: 900;">0</span></p>
            <button class="btn btn-start" onclick="startGame()">เล่นอีกครั้ง</button>
        </div>

        <div class="board-container">
            <div class="grid-board" id="grid-board"></div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="input-zone-container" id="input-zone">
            <!-- User input tiles will appear here -->
            <span style="color:#aaa; font-family:'Mali';">พิมพ์หรือกดเครื่องหมายเพื่อสร้างสมการ...</span>
        </div>

        <div class="rack">
            <div class="rack-row">
                <div class="rack-tile" data-score="1" onclick="inputChar('1')">1</div>
                <div class="rack-tile" data-score="1" onclick="inputChar('2')">2</div>
                <div class="rack-tile" data-score="1" onclick="inputChar('3')">3</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('4')">4</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('5')">5</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('6')">6</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('7')">7</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('8')">8</div>
                <div class="rack-tile" data-score="2" onclick="inputChar('9')">9</div>
                <div class="rack-tile" data-score="1" onclick="inputChar('0')">0</div>
            </div>
            <div class="rack-row">
                <div class="rack-tile op" data-score="2" onclick="inputChar('+')">+</div>
                <div class="rack-tile op" data-score="2" onclick="inputChar('-')">-</div>
                <div class="rack-tile op" data-score="2" onclick="inputChar('×')">×</div>
                <div class="rack-tile op" data-score="2" onclick="inputChar('÷')">÷</div>
                <div class="rack-tile op" data-score="1" onclick="inputChar('=')">=</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-red" onclick="deleteChar()">ลบ (DEL)</button>
            <button class="btn btn-green" onclick="submitEquation()">ส่งคำตอบ (ENTER)</button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 90;
        let timerInterval;
        let currentInput = "";
        let boardState = Array(15).fill(null).map(() => Array(15).fill(false));

        const tileScores = {
            '0': 1, '1': 1, '2': 1, '3': 1, '4': 2,
            '5': 2, '6': 2, '7': 2, '8': 2, '9': 2,
            '+': 2, '-': 2, '×': 2, '÷': 2, '=': 1
        };

        const TW = ['0,0','0,7','0,14','7,0','7,14','14,0','14,7','14,14'];
        const DW = ['1,1','2,2','3,3','4,4','1,13','2,12','3,11','4,10','13,1','12,2','11,3','10,4','13,13','12,12','11,11','10,10'];
        const TL = ['1,5','1,9','5,1','5,5','5,9','5,13','9,1','9,5','9,9','9,13','13,5','13,9'];
        const DL = ['0,3','0,11','2,6','2,8','3,0','3,7','3,14','6,2','6,6','6,8','6,12','7,3','7,11','8,2','8,6','8,8','8,12','11,0','11,7','11,14','12,6','12,8','14,3','14,11'];

        function initBoard() {
            const board = document.getElementById('grid-board');
            board.innerHTML = '';
            boardState = Array(15).fill(null).map(() => Array(15).fill(false));
            
            for(let r=0; r<15; r++){
                for(let c=0; c<15; c++){
                    let cell = document.createElement('div');
                    let coord = `${r},${c}`;
                    let cls = 'cell';
                    let label = '';
                    
                    if(r===7 && c===7){ cls += ' star'; label = '★'; }
                    else if(TW.includes(coord)){ cls += ' tw'; label = '3W'; }
                    else if(DW.includes(coord)){ cls += ' dw'; label = '2W'; }
                    else if(TL.includes(coord)){ cls += ' tl'; label = '3L'; }
                    else if(DL.includes(coord)){ cls += ' dl'; label = '2L'; }

                    cell.className = cls;
                    cell.id = `cell-${r}-${c}`;
                    if(label) cell.innerHTML = `<span class="cell-label">${label}</span>`;
                    board.appendChild(cell);
                }
            }
        }

        function startGame() {
            score = 0; timeLeft = 90; currentInput = "";
            updateStats();
            document.getElementById('error-msg').innerText = '';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            initBoard();
            renderInputZone();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
        }

        function inputChar(char) {
            if (currentInput.length < 15) {
                currentInput += char;
                renderInputZone();
                document.getElementById('error-msg').innerText = '';
            }
        }

        function deleteChar() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                renderInputZone();
                document.getElementById('error-msg').innerText = '';
            }
        }

        function renderInputZone() {
            const zone = document.getElementById('input-zone');
            if(currentInput.length === 0) {
                zone.innerHTML = `<span style="color:#aaa; font-family:'Mali';">พิมพ์หรือกดเครื่องหมายเพื่อสร้างสมการ...</span>`;
                return;
            }
            zone.innerHTML = '';
            for(let char of currentInput) {
                let s = tileScores[char] || 0;
                zone.innerHTML += `<div class="input-tile" data-score="${s}">${char}</div>`;
            }
        }

        function showError(msg) {
            document.getElementById('error-msg').innerText = msg;
            const zone = document.getElementById('input-zone');
            zone.style.transform = "translateX(-5px)";
            setTimeout(() => zone.style.transform = "translateX(5px)", 50);
            setTimeout(() => zone.style.transform = "translateX(0)", 100);
        }

        function submitEquation() {
            if(currentInput.length < 5) return showError("สมการต้องมีอย่างน้อย 5 ตัวอักษร");
            
            let parts = currentInput.split('=');
            if(parts.length !== 2) return showError("ต้องมีเครื่องหมาย = แค่ 1 ตัวตรงกลางสมการ");
            if(parts[0] === "" || parts[1] === "") return showError("สมการไม่สมบูรณ์");

            try {
                // Parse calculation securely
                let lStr = parts[0].replace(/×/g, '*').replace(/÷/g, '/');
                let rStr = parts[1].replace(/×/g, '*').replace(/÷/g, '/');
                
                // Prevent leading zeros issues in eval by parsing properly (Regex removes leading zeros for numbers)
                lStr = lStr.replace(/ 0+(\d)/g, '$1'); 
                rStr = rStr.replace(/ 0+(\d)/g, '$1');

                let leftVal = eval(lStr);
                let rightVal = eval(rStr);

                if (leftVal === rightVal && leftVal !== undefined && !isNaN(leftVal) && leftVal !== Infinity) {
                    placeEquationOnBoard(currentInput);
                    currentInput = "";
                    renderInputZone();
                } else {
                    showError("สมการไม่เป็นจริง (สองฝั่งไม่เท่ากัน)!");
                }
            } catch (e) {
                showError("รูปแบบสมการผิดพลาด (เช่น ใส่เครื่องหมายติดกัน)");
            }
        }

        function placeEquationOnBoard(eqStr) {
            let len = eqStr.length;
            let placed = false;
            let r, c, isHorizontal;

            // Try to find an empty random spot (max 100 attempts to avoid infinite loop)
            for(let attempt=0; attempt<100; attempt++) {
                isHorizontal = Math.random() > 0.5;
                if(isHorizontal) {
                    r = Math.floor(Math.random() * 15);
                    c = Math.floor(Math.random() * (16 - len));
                } else {
                    r = Math.floor(Math.random() * (16 - len));
                    c = Math.floor(Math.random() * 15);
                }
                
                // Check if completely empty
                let free = true;
                for(let i=0; i<len; i++) {
                    let tr = isHorizontal ? r : r+i;
                    let tc = isHorizontal ? c+i : c;
                    if(boardState[tr][tc]) { free = false; break; }
                }
                if(free) { placed = true; break; }
            }

            // If board is very full (rare in 90s), just clear it
            if(!placed) { initBoard(); r=7; c=0; isHorizontal=true; }

            let totalPoints = 0;
            let wordMultiplier = 1;

            for(let i=0; i<len; i++) {
                let tr = isHorizontal ? r : r+i;
                let tc = isHorizontal ? c+i : c;
                let char = eqStr[i];
                let coord = `${tr},${tc}`;
                
                boardState[tr][tc] = true;
                
                let tileScore = tileScores[char] || 0;
                let cell = document.getElementById(`cell-${tr}-${tc}`);

                // Calculate Multipliers
                if(TW.includes(coord)) wordMultiplier *= 3;
                else if(DW.includes(coord) || (tr===7 && tc===7)) wordMultiplier *= 2;
                
                if(TL.includes(coord)) tileScore *= 3;
                else if(DL.includes(coord)) tileScore *= 2;

                totalPoints += tileScore;

                cell.innerHTML += `<div class="tile" data-score="${tileScores[char]}">${char}</div>`;
            }

            let finalScore = totalPoints * wordMultiplier;
            score += finalScore;
            updateStats();
            
            document.getElementById('error-msg').style.color = '#388e3c';
            showError(`ยอดเยี่ยม! ได้รับ ${finalScore} คะแนน`);
            setTimeout(()=> { document.getElementById('error-msg').style.color = '#d32f2f'; }, 2000);
        }

        // Keyboard support
        window.addEventListener('keydown', function(e) {
            if(!document.getElementById('start-screen').classList.contains('hidden') || 
               !document.getElementById('end-screen').classList.contains('hidden')) return;
               
            if (e.key >= '0' && e.key <= '9') inputChar(e.key);
            else if (e.key === '+') inputChar('+');
            else if (e.key === '-') inputChar('-');
            else if (e.key === '*' || e.key === 'x' || e.key === 'X') inputChar('×');
            else if (e.key === '/') inputChar('÷');
            else if (e.key === '=' || e.key === 'Enter') {
                if(e.key === '=') {
                    if(!currentInput.includes('=')) inputChar('=');
                    else submitEquation(); // If = is pressed again, try to submit
                } else {
                    submitEquation();
                }
            }
            else if (e.key === 'Backspace') deleteChar();
        });

        initBoard(); // background preview

    </script>
</body>
</html>
