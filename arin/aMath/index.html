<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amath Speed Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .board-container {
            background-color: #0b5345; /* สีกระดานเขียวเข้ม */
            padding: 30px;
            border-radius: 10px;
            border: 8px solid #145a32;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
            color: white;
        }

        h1 {
            margin-top: 0;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2em;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }

        /* สไตล์เบี้ย Amath */
        .tile-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin: 20px 0;
            min-height: 55px;
        }

        .tile {
            background-color: #fdf5e6; /* สีเบี้ยงาช้าง */
            color: #333;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 2px 3px 0px #bca88e;
            position: relative;
            user-select: none;
        }

        /* คะแนนห้อยมุมขวาล่างของเบี้ย */
        .tile::after {
            content: attr(data-score);
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: normal;
            color: #555;
        }

        .tile.empty {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            color: transparent;
        }

        .tile.empty::after { content: ""; }

        /* แป้นพิมพ์เบี้ยด้านล่าง */
        .rack {
            background-color: #873600; /* สีแป้นไม้วางเบี้ย */
            padding: 15px 10px;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
        }

        .rack .tile {
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .rack .tile:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #bca88e;
        }

        .action-tile {
            font-size: 16px !important;
            width: 60px !important;
            background-color: #e67e22 !important;
            color: white !important;
            box-shadow: 2px 3px 0px #d35400 !important;
        }

        .btn {
            background-color: #f1c40f;
            color: #333;
            border: none;
            padding: 12px 25px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 0 #d4ac0d;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hidden { display: none; }
        
        #message {
            height: 25px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.2em;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }

    </style>
</head>
<body>

<div class="board-container">
    <h1>Amath Speed ✖️➗ สำหรับอลิน</h1>
    
    <div id="start-screen">
        <p>สร้างสมการให้ถูกต้องให้ได้มากที่สุดใน 45 วินาที!</p>
        <p>(สามารถคลิกเบี้ยบนจอ หรือพิมพ์ตัวเลขจากคีย์บอร์ดก็ได้)</p>
        <button class="btn" onclick="startGame()">เริ่มเล่น!</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats">
            <div>คะแนน: <span id="score">0</span></div>
            <div>เวลา: <span id="time">45</span> วิ</div>
        </div>
        
        <!-- กระดานแสดงสมการ -->
        <div id="board-equation" class="tile-row">
            <!-- เบี้ยสมการจะถูกสร้างที่นี่ผ่าน JavaScript -->
        </div>
        
        <div id="message"></div>

        <!-- แป้นวางเบี้ย (สำหรับกดตอบ) -->
        <div class="rack">
            <div class="tile-row">
                <div class="tile rack-tile" data-score="1" onclick="inputNumber('1')">1</div>
                <div class="tile rack-tile" data-score="1" onclick="inputNumber('2')">2</div>
                <div class="tile rack-tile" data-score="1" onclick="inputNumber('3')">3</div>
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('4')">4</div>
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('5')">5</div>
            </div>
            <div class="tile-row">
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('6')">6</div>
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('7')">7</div>
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('8')">8</div>
                <div class="tile rack-tile" data-score="2" onclick="inputNumber('9')">9</div>
                <div class="tile rack-tile" data-score="1" onclick="inputNumber('0')">0</div>
            </div>
            <div class="tile-row" style="margin-top: 15px;">
                <div class="tile action-tile" onclick="deleteNumber()">ลบ</div>
                <div class="tile action-tile" style="background-color: #27ae60 !important; box-shadow: 2px 3px 0px #1e8449 !important; width: 100px !important;" onclick="checkAnswer()">ตกลง</div>
            </div>
        </div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>หมดเวลา! ⏱️</h2>
        <p style="font-size: 1.5em;">คะแนนของคุณ: <strong id="final-score" style="color:#f1c40f;">0</strong></p>
        <button class="btn" onclick="startGame()">เล่นอีกครั้ง</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 45;
    let timerInterval;
    let currentAnswer = "";
    let playerInput = "";

    // ข้อมูลคะแนนของตัวเลขและเครื่องหมายตาม Amath (คร่าวๆ)
    const tileScores = {
        '0': 1, '1': 1, '2': 1, '3': 1, '4': 2,
        '5': 2, '6': 2, '7': 2, '8': 2, '9': 2,
        '+': 2, '-': 2, '×': 2, '÷': 2, '=': 1
    };

    function startGame() {
        score = 0;
        timeLeft = 45;
        document.getElementById('score').textContent = score;
        document.getElementById('time').textContent = timeLeft;
        document.getElementById('message').textContent = '';
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        playerInput = "";
        generateEquation();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTime, 1000);
    }

    function updateTime() {
        timeLeft--;
        document.getElementById('time').textContent = timeLeft;
        if (timeLeft <= 0) endGame();
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
    }

    function generateEquation() {
        playerInput = "";
        const operators = ['+', '-', '×', '÷'];
        const operator = operators[Math.floor(Math.random() * operators.length)];
        let num1, num2, ans;

        switch(operator) {
            case '+':
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * 50) + 1;
                ans = num1 + num2;
                break;
            case '-':
                num1 = Math.floor(Math.random() * 50) + 20;
                num2 = Math.floor(Math.random() * 20) + 1;
                ans = num1 - num2;
                break;
            case '×':
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 12) + 2;
                ans = num1 * num2;
                break;
            case '÷':
                num2 = Math.floor(Math.random() * 9) + 2;
                ans = Math.floor(Math.random() * 12) + 2;
                num1 = num2 * ans;
                break;
        }

        currentAnswer = ans.toString();
        
        // สร้างสตริงสมการ เช่น "12+5="
        let eqString = `${num1}${operator}${num2}=`;
        renderBoard(eqString);
    }

    function renderBoard(eqString) {
        const board = document.getElementById('board-equation');
        board.innerHTML = ''; // ล้างกระดาน

        // วางเบี้ยโจทย์
        for (let char of eqString) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.textContent = char;
            tile.setAttribute('data-score', tileScores[char] || 0);
            board.appendChild(tile);
        }

        // วางเบี้ยคำตอบของผู้เล่น (เรียงตามจำนวนหลักที่พิมพ์)
        // สร้างช่องว่างรอไว้ตามจำนวนหลักของคำตอบที่ถูกต้อง
        let answerLength = currentAnswer.length;
        
        for (let i = 0; i < answerLength; i++) {
            const tile = document.createElement('div');
            if (playerInput[i] !== undefined) {
                // ถ้าผู้เล่นพิมพ์มาแล้ว ให้แสดงเบี้ย
                let val = playerInput[i];
                tile.className = 'tile';
                tile.textContent = val;
                tile.setAttribute('data-score', tileScores[val]);
            } else {
                // ถ้ายังไม่พิมพ์ ให้เป็นช่องว่าง
                tile.className = 'tile empty';
            }
            board.appendChild(tile);
        }
    }

    // ฟังก์ชันรับค่าจากแป้นกดบนหน้าจอ
    function inputNumber(numStr) {
        if (playerInput.length < currentAnswer.length) {
            playerInput += numStr;
            renderBoard(document.getElementById('board-equation').innerText.split('=')[0].replace(/\s+/g, '') + '=');
            
            // ถ้ากรอกครบตามจำนวนหลักแล้ว ตรวจคำตอบอัตโนมัติ
            if(playerInput.length === currentAnswer.length) {
                setTimeout(checkAnswer, 150);
            }
        }
    }

    function deleteNumber() {
        if (playerInput.length > 0) {
            playerInput = playerInput.slice(0, -1);
            renderBoard(document.getElementById('board-equation').innerText.split('=')[0].replace(/\s+/g, '') + '=');
        }
    }

    function checkAnswer() {
        if (playerInput === "") return;
        
        const msg = document.getElementById('message');
        if (playerInput === currentAnswer) {
            score += 10; // ได้แต้ม
            document.getElementById('score').textContent = score;
            msg.textContent = 'สมการถูกต้อง! 🎉';
            msg.className = 'correct';
            setTimeout(() => { msg.textContent = ''; generateEquation(); }, 500);
        } else {
            msg.textContent = 'ผิดครับ ลองใหม่! ❌';
            msg.className = 'wrong';
            playerInput = ""; // ล้างคำตอบให้พิมพ์ใหม่
            renderBoard(document.getElementById('board-equation').innerText.split('=')[0].replace(/\s+/g, '') + '=');
            setTimeout(() => { msg.textContent = ''; }, 1000);
        }
    }

    // รองรับการพิมพ์จากคีย์บอร์ด
    window.addEventListener('keydown', function(e) {
        if(document.getElementById('game-screen').classList.contains('hidden')) return;
        
        if (e.key >= '0' && e.key <= '9') {
            inputNumber(e.key);
        } else if (e.key === 'Backspace') {
            deleteNumber();
        } else if (e.key === 'Enter') {
            checkAnswer();
        }
    });

</script>

</body>
</html>
