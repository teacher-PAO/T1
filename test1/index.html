<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมคูณมหาสนุก (ประถม 2)</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #fdf2e9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #fff;
            border: 4px solid #eb984e;
            border-radius: 20px;
            padding: 30px;
            width: 450px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d35400;
            margin-top: 0;
        }
        .controls {
            background-color: #fcf3cf;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        label {
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
        }
        input[type="range"] {
            vertical-align: middle;
        }
        .grid-container {
            display: grid;
            justify-content: center;
            gap: 10px;
            min-height: 150px;
            margin-bottom: 20px;
        }
        .apple {
            font-size: 40px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
        .equation-area {
            font-size: 28px;
            font-weight: bold;
            background-color: #e8f8f5;
            padding: 15px;
            border-radius: 15px;
        }
        .answer-input {
            width: 70px;
            font-size: 24px;
            text-align: center;
            border: 3px solid #ccc;
            border-radius: 10px;
            padding: 5px;
        }
        .btn-check {
            background-color: #58d68d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-check:hover {
            background-color: #2ecc71;
        }
        #feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            height: 30px;
        }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🍎 โซน 1: อาเรย์นักประดิษฐ์</h1>
    
    <div class="controls">
        <div>
            <label>จำนวนแถว (Rows): <span id="rowCount">3</span></label><br>
            <input type="range" id="rows" min="1" max="5" value="3" oninput="updateGame()">
        </div>
        <div style="margin-top: 10px;">
            <label>จำนวนคอลัมน์ (Cols): <span id="colCount">4</span></label><br>
            <input type="range" id="cols" min="1" max="5" value="4" oninput="updateGame()">
        </div>
    </div>

    <div class="grid-container" id="grid">
        </div>

    <div class="equation-area">
        <span id="eq-rows">3</span> × <span id="eq-cols">4</span> = 
        <input type="number" id="player-answer" class="answer-input" placeholder="?">
    </div>

    <button class="btn-check" onclick="checkAnswer()">ตรวจสอบคำตอบ</button>
    <div id="feedback"></div>
</div>

<script>
    function updateGame() {
        const rows = document.getElementById('rows').value;
        const cols = document.getElementById('cols').value;
        const grid = document.getElementById('grid');
        
        // อัปเดตตัวเลขบนหน้าจอ
        document.getElementById('rowCount').innerText = rows;
        document.getElementById('colCount').innerText = cols;
        document.getElementById('eq-rows').innerText = rows;
        document.getElementById('eq-cols').innerText = cols;
        
        // ล้างช่องคำตอบและข้อความแจ้งเตือน
        document.getElementById('player-answer').value = '';
        document.getElementById('feedback').innerText = '';
        
        // สร้างอาเรย์แอปเปิล
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${cols}, 50px)`;
        grid.style.gridTemplateRows = `repeat(${rows}, 50px)`;
        
        const totalApples = rows * cols;
        for (let i = 0; i < totalApples; i++) {
            const apple = document.createElement('div');
            apple.classList.add('apple');
            apple.innerText = '🍎';
            // เพิ่ม delay เล็กน้อยให้แอปเปิลเด้งทีละลูก
            apple.style.animationDelay = `${i * 0.05}s`;
            grid.appendChild(apple);
        }
    }

    function checkAnswer() {
        const rows = document.getElementById('rows').value;
        const cols = document.getElementById('cols').value;
        const correctAnswer = rows * cols;
        const playerAnswer = parseInt(document.getElementById('player-answer').value);
        const feedback = document.getElementById('feedback');

        if (isNaN(playerAnswer)) {
            feedback.innerText = "กรุณาพิมพ์ตัวเลขก่อนนะ!";
            feedback.className = 'wrong';
            return;
        }

        if (playerAnswer === correctAnswer) {
            feedback.innerText = "⭐ ถูกต้อง! เก่งมาก ⭐";
            feedback.className = 'correct';
        } else {
            feedback.innerText = "❌ ยังไม่ถูก ลองนับแอปเปิลดูใหม่นะ";
            feedback.className = 'wrong';
        }
    }

    // เริ่มเกมครั้งแรกเมื่อโหลดหน้าเว็บ
    updateGame();
</script>

</body>
</html>
